<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Napoli — городская пиццерия с понятным меню, быстрой доставкой и самовывозом."
    />
    <meta name="theme-color" content="#17191d" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference = 'system';
        try {
          const stored = JSON.parse(localStorage.getItem('napoli:theme:v1') || 'null');
          if (stored?.schemaVersion === 1 && ['light', 'dark', 'system'].includes(stored.preference)) {
            preference = stored.preference;
          }
        } catch { /* The system theme also works when storage is unavailable. */ }
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#14171d' : '#f6f3ec';
      })();
    </script>
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Napoli" />
    <meta property="og:title" content="Napoli" />
    <meta
      property="og:description"
      content="Городская пиццерия: меню, доставка и самовывоз без лишних шагов."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/napoli-social-card.svg" />
    <meta property="og:image:alt" content="Napoli — городская пиццерия" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Napoli" />
    <meta name="twitter:description" content="Городская пиццерия: меню, доставка и самовывоз без лишних шагов." />
    <meta name="twitter:image" content="/napoli-social-card.svg" />
    <meta name="twitter:image:alt" content="Napoli — городская пиццерия" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Unbounded:wght@600;700&amp;display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <title>Napoli — городская пиццерия</title>
  </head>
  <body>
    <noscript>Для работы меню Napoli включите JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
